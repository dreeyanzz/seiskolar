# The job name `checks` is a required status check on main; renaming it blocks every
# pull request until the ruleset is updated. There are no `paths:` filters on
# purpose: a required check that never runs leaves a pull request waiting forever.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A commit made without the hooks (a lab PC, the GitHub web editor) still
      # gets its formatting checked here.
      - run: npm run format:check
      # A swimlane has one picture. A screen has one per device (phone, tablet,
      # desktop), and one set per state it lists (scripts/render.mjs).
      - name: Every drawing has its pictures
        run: |
          missing=0
          for f in $(git ls-files '02-swimlanes/*.html'); do
            if [ ! -f "${f%.html}.png" ]; then
              echo "::error file=$f::No ${f%.html}.png. Run: npm run render -- $f, then commit the PNG."
              missing=1
            fi
          done
          for f in $(git ls-files '03-low-fidelity/*.html' '04-high-fidelity/*.html'); do
            base="${f%.html}"
            for device in phone tablet desktop; do
              if ! compgen -G "$base.$device.png" >/dev/null && ! compgen -G "$base--*.$device.png" >/dev/null; then
                echo "::error file=$f::No $device picture. Run: npm run render -- $f, then commit the PNGs."
                missing=1
              fi
            done
          done
          exit $missing
