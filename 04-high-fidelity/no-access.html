<!doctype html>
<!--
  Account not ready. A high-fidelity screen of SEIskolar.

  Finishes 03-low-fidelity/no-access.html, with the same content and states. That
  wireframe is this screen's source: change it first, then this file.
  Serves swimlane steps S01.5, S01.6, in 02-swimlanes/01-sign-in.html.
  SRS: FR-IAM-001.
  It has one state.
  Owner: @gnthril.

  What the wireframe's notes say:
  - Without a role, region and school, SEIskolar returns no records at all (FR-IAM-001,
    S01.6). Pointing the person to their Regional Office is our wording; the SRS says only
    that every list is empty.

  Its look and frame come from _style.css and _app.js (see README.md). Nothing here is
  saved: a button that would save something shows a short message instead.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your account isn't ready yet · SEIskolar</title>
    <link rel="stylesheet" href="_style.css" />
    <script src="_app.js" defer></script>
  </head>
  <body data-role="public">
    <main class="alone">
      <div class="panel">
        <div class="alone-brand">
          <span class="mark" data-mark="school"></span>
          <div class="brand-text">
            <span class="brand-name">Cebu Institute of Technology – University</span>
            <span class="brand-sub">Scholar portal · SEIskolar</span>
          </div>
        </div>
        <section class="card stack">
          <h1>Your account isn't ready yet</h1>
          <p class="small muted">Signed in as bea.santiago@example.test</p>
          <p>
            Your account has no role, region or school yet, so there is nothing to show
            you.
          </p>
          <p class="muted">Your DOST Regional Office sets up scholar accounts.</p>
          <a class="btn block" href="sign-in.html?state=school">Sign out</a>
        </section>
      </div>
    </main>
  </body>
</html>
