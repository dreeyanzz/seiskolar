<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="render-states" content="school console wrong-password" />
    <title>Sign in · SEIskolar</title>
    <link rel="stylesheet" href="_style.css" />
    <script src="_app.js" defer></script>
  </head>
  <body data-role="public">
    <main class="alone">
      <div class="panel">
        <div class="alone-brand" data-state="school wrong-password">
          <span class="mark" data-mark="school"></span>
          <div class="brand-text">
            <span class="brand-name">Cebu Institute of Technology – University</span>
            <span class="brand-sub">Scholar portal · SEIskolar</span>
          </div>
        </div>
        <div class="alone-brand" data-state="console">
          <span class="mark" data-mark="seiskolar"></span>
          <div class="brand-text">
            <span class="brand-name">SEIskolar</span>
            <span class="brand-sub">DOST console</span>
          </div>
        </div>

        <section class="card stack">
          <h1>Sign in</h1>
          <p class="error" data-state="wrong-password" role="alert">
            <span data-icon="alert"></span>Wrong email or password.
          </p>
          <div class="field" data-state="school console">
            <label class="label" for="email">Email</label>
            <input
              class="input"
              id="email"
              type="email"
              autocomplete="username"
              placeholder="name@example.test"
            />
          </div>
          <div class="field" data-state="wrong-password">
            <label class="label" for="email-again">Email</label>
            <input
              class="input"
              id="email-again"
              type="email"
              autocomplete="username"
              value="bea.santiago@example.test"
            />
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input
              class="input"
              id="password"
              type="password"
              autocomplete="current-password"
            />
          </div>
          <a
            class="btn primary block"
            href="scholar-dashboard.html"
            data-state="school wrong-password"
            >Sign in</a
          >
          <a class="btn primary block" href="regional-home.html" data-state="console"
            >Sign in</a
          >
        </section>
      </div>
    </main>
  </body>
</html>
